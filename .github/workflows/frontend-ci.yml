name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Testes unitários
        run: npm test -- --watch=false

      - name: Build de produção
        run: npm run build
