<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Work Station</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap"
      rel="stylesheet"
    />
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #22303a;
        color: #f1f5f9;
        font-family: 'Nunito Sans', system-ui, sans-serif;
      }
      .app-splash i {
        font-size: 3.5rem;
        color: #14b8a6;
      }
      .app-splash__brand {
        text-align: center;
        line-height: 1.25;
      }
      .app-splash__brand-primary {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .app-splash__brand-secondary {
        font-size: 0.95rem;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: #9db4bf;
      }
      .app-splash__dots {
        display: flex;
        gap: 0.5rem;
      }
      .app-splash__dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #14b8a6;
        opacity: 0.35;
        animation: splashPulse 1.2s infinite ease-in-out;
      }
      .app-splash__dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .app-splash__dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes splashPulse {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash">
        <i class="bi bi-building"></i>
        <div class="app-splash__brand">
          <div class="app-splash__brand-primary">Work Station</div>
          <div class="app-splash__brand-secondary">Controle Imobiliário</div>
        </div>
        <div class="app-splash__dots"><span></span><span></span><span></span></div>
      </div>
    </app-root>
  </body>
</html>
